<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cjhan — Welcome</title>
  <meta name="description" content="cjhan 的个人主页 — 视觉作品与联系" />
  <meta property="og:title" content="cjhan — Welcome" />
  <meta property="og:description" content="cjhan 的个人主页 — 视觉作品与联系" />
  <meta property="og:image" content="/preview.jpg" />
  <link rel="icon" href="/preview.jpg" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/assets/css/custom-background.css" />
  <style>
    /* 强制覆盖可能的其他背景规则，确保 preview.jpg 作为全屏背景 */
    body.landing, html {
      background-image: url('/preview.jpg') !important;
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
      min-height: 100vh !important;
      background-color: transparent !important;
    }
    .landing-shell { background: transparent !important; }
  </style>
</head>
<body class="landing">
  <div class="landing-shell">
    <header class="landing-header">
      <div class="brand">
        <img class="avatar" src="/preview.jpg" alt="cjhan" width="56" height="56" />
        <div class="brand-text">
          <h1>cjhan</h1>
          <p class="subtitle">视觉创作 · 设计 · AI 实验</p>
        </div>
      </div>

      <form class="simple-search" onsubmit="return doSearch(event)" style="margin-left:12px;">
        <input id="s" type="search" placeholder="Search" aria-label="Search" style="padding:6px 8px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:inherit;">
      </form>

      <nav class="top-links">
        <a href="/about.html">About</a>
        <a href="/projects.html">Projects</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>

    <main class="landing-hero">
      <div class="hero-inner">
        <h2 class="hero-title">你好，我是 <strong>cjhan</strong>，是也够！</h2>
        <p class="hero-sub">视觉创作与实验 — 点击下面进入作品或联系我</p>

        <div class="nav-cta">
          <a class="cta cta-primary" href="/projects.html">查看作品</a>
          <a class="cta cta-secondary" href="/about.html">关于我</a>
          <a class="cta cta-tertiary" href="/contact.html">联系我</a>
        </div>
      </div>
    </main>

    <footer class="landing-footer">
      <p>© <span id="year"></span> cjhan — Built with GitHub Pages</p>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    function doSearch(e){
      if(e) e.preventDefault();
      var q = document.getElementById('s').value.trim();
      if(!q) return false;
      var host = window.location.hostname;
      var url = 'https://www.google.com/search?q=' + encodeURIComponent('site:' + host + ' ' + q);
      window.open(url, '_blank');
      return false;
    }
  </script>
</body>
</html>
